<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="This is the activity for JS Circle with Shapes">
   <title>JS Circle with Shapes</title>
   <style>
      *{
         margin: 0;
         padding: 0;
         vertical-align: center;
      }
      div#buttons{
         z-index: 999;
         position: relative;
      }
      div#canvas{
         width: 100%;
         height: 600px;
         position: relative;
         z-index: 0;
      }
      button{
         width: 100px;
         height: 50px;
         vertical-align: bottom;
         border: solid 2px black;
         cursor: pointer;
         margin: 0 5px;
      }
         button#reset{
            margin-left: 25%;
         }
         button#green{
            background-color: green;
         }
         button#red{
            background-color: red;
            margin-right: 25%;
         }
         button#blue{
            background-color: blue;
         }
      span{
         font-size: 50px;
         line-height: calc(50 - (50 * 0.75))px;
         cursor: pointer;
         margin-right: 30px;
      }
   </style>
</head>
<body>
   <div id="buttons"><!--
   --><button id="green" name="default-color"></button><!--
   --><button id="blue"></button><!--
   --><button id="red"></button><!--
   --><span id="current" name="default-shape" data-curr="&#11044;" data-non="&#11096;" style="color: green;">&#11044;</span><!--
   --><span data-curr="&#9724;" data-non="&#9723;">&#9723;</span><!--
   --><span data-curr="&bigstar;" data-non="&star;">&star;</span><!--
   --><button id="reset">Reset</button><!--
--></div>
   <div id="canvas">

   </div>
   <script src="js_shapes_v2.js"></script>
</body>
</html>
