<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is the activity for Note">
        <link rel="stylesheet" href="style.css">
        <script src="note.js"></script>
        <script src="action.js"></script>
        <title>Node JS</title>
    </head>
    <body>
    <form id="deleter">
        <input type="text" id="key" placeholder="Key">
        <input type="number" id="pitch" placeholder="pitch" min="1" max="7">
        <button type="button" id="save">Save</button>
        <button type="button" id="cancel">Cancel</button>
    </form>
    <div id="wrapper">
        <select id="instrument">
            <option value="piano">Piano</option>
            <option value="xylo">Xylophone</option>
        </select>
        <div id="piano">
            <button data-note="do">Do</button>
            <button data-note="re">Re</button>
            <button data-note="mi">Mi</button>
            <button data-note="fa">Fa</button>
            <button data-note="sol">Sol</button>
            <button data-note="la">La</button>
            <button data-note="ti">Ti</button>
        </div>
        <div id="xylo">
            <button data-note="do">Do</button>
            <button data-note="re">Re</button>
            <button data-note="mi">Mi</button>
            <button data-note="fa">Fa</button>
            <button data-note="sol">Sol</button>
            <button data-note="la">La</button>
            <button data-note="ti">Ti</button>
        </div>
        <div id="buttons">
            <button id="shuffle">shuffle</button>
            <input id="number" type="number" min="1" max="100">
            <button id="compose">compose</button>
            <button id="remove">remove</button>
            <button id="play">play</button>
        </div>
        <div id="notes"></div>
    </div>
    </body>
</html>
